name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validate tag metadata
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup default 1.95.0
          version="${GITHUB_REF_NAME#v}"
          test "$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$version"
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package evidence
        run: |
          mkdir -p dist
          cp target/release/mcp-schema-compat dist/mcp_schema_compat-linux-x86_64
          tar -czf "dist/mcp_schema_compat-${GITHUB_REF_NAME}.tar.gz" -C dist mcp_schema_compat-linux-x86_64
          cargo install cargo-cyclonedx --version 0.5.7 --locked
          cargo cyclonedx --format json
          cp mcp-schema-compat.cdx.json "dist/SBOM-${GITHUB_REF_NAME}.cdx.json"
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Attest release archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/mcp_schema_compat-${{ github.ref_name }}.tar.gz
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --prerelease
