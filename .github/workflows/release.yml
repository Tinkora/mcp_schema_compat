name: Release

'on':
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag, version, and changelog
        id: metadata
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "$RELEASE_TAG" == v* && "$version" == "$manifest_version" ]] || {
            echo "tag does not match Cargo.toml version" >&2
            exit 1
          }
          grep -Fq "## [${version}]" CHANGELOG.md || {
            echo "CHANGELOG.md has no ${version} release entry" >&2
            exit 1
          }
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]] || { echo "tag does not identify the workflow commit" >&2; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "release commit is not on main" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          [[ "$status" == 404 ]] || { echo "release lookup returned HTTP ${status}; refusing to continue" >&2; exit 1; }

  quality:
    name: Release quality gate
    uses: Tinkora/.github/.github/workflows/reusable-rust-quality.yml@e967aed0860957b24daf57e66766713c60b5bcae
    permissions:
      contents: read
    with:
      toolchain: 1.95.0
      msrv: 1.85.0

  supply-chain:
    name: Release dependency gate
    uses: Tinkora/.github/.github/workflows/reusable-supply-chain.yml@e967aed0860957b24daf57e66766713c60b5bcae
    permissions:
      contents: read
    with:
      working-directory: .
      toolchain: 1.88.0

  build:
    name: Build ${{ matrix.platform }}
    needs: [validate, quality, supply-chain]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            binary: mcp-schema-compat
            extension: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            binary: mcp-schema-compat
            extension: tar.gz
          - runner: macos-15
            target: x86_64-apple-darwin
            platform: macos-x86_64
            binary: mcp-schema-compat
            extension: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            binary: mcp-schema-compat.exe
            extension: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup target add "$TARGET" --toolchain 1.95.0

      - name: Build release binary
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          package="mcp_schema_compat-v${VERSION}-${PLATFORM}"
          mkdir -p "staging/${package}" dist
          cp "target/${TARGET}/release/${BINARY}" "staging/${package}/"
          cp LICENSE README.md README.zh-CN.md CHANGELOG.md "staging/${package}/"
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          find staging -exec touch -h -d "@${epoch}" {} + 2>/dev/null || find staging -exec touch -h -t "$(date -u -r "$epoch" +%Y%m%d%H%M.%S)" {} +
          TZ=UTC tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
            -czf "dist/${package}.tar.gz" -C staging "$package" 2>/dev/null || \
            tar -czf "dist/${package}.tar.gz" -C staging "$package"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = "mcp_schema_compat-v${env:VERSION}-${env:PLATFORM}"
          New-Item -ItemType Directory -Path "staging/${package}", dist -Force | Out-Null
          Copy-Item "target/${env:TARGET}/release/${env:BINARY}" "staging/${package}/"
          Copy-Item LICENSE, README.md, README.zh-CN.md, CHANGELOG.md "staging/${package}/"
          Compress-Archive -Path "staging/${package}" -DestinationPath "dist/${package}.zip"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  collect:
    name: Collect release archives
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-source
          merge-multiple: true

      - name: Add release metadata
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$(find release-source -maxdepth 1 -type f | wc -l | tr -d ' ')" == 4 ]] || {
            echo "expected four platform archives" >&2
            exit 1
          }
          jq -n --arg commit "$GITHUB_SHA" --arg version "$VERSION" \
            '{commit: $commit, version: $version}' > release-source/release-metadata.json

      - name: Upload release source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-source
          if-no-files-found: error
          retention-days: 7

  evidence:
    name: Generate checksums, SBOM, and licenses
    needs: [validate, collect]
    uses: Tinkora/.github/.github/workflows/reusable-release.yml@e967aed0860957b24daf57e66766713c60b5bcae
    permissions:
      contents: read
    with:
      source-artifact-name: release-source-${{ github.run_id }}-${{ github.run_attempt }}
      version: ${{ needs.validate.outputs.version }}
      publish: false

  attest:
    name: Attest archives and SBOM
    needs: [validate, evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download verified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.evidence.outputs.candidate-artifact-name }}
          path: release-candidate

      - name: Verify candidate checksums
        run: cd release-candidate && sha256sum --check --strict SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-candidate/mcp_schema_compat-*

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-candidate/mcp_schema_compat-*
          sbom-path: release-candidate/SBOM.spdx.json

  release:
    name: Publish GitHub Release
    needs: [validate, evidence, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.evidence.outputs.candidate-artifact-name }}
          path: release-candidate

      - name: Reverify and publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          (cd release-candidate && sha256sum --check --strict SHA256SUMS)
          mapfile -d '' assets < <(find release-candidate -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
          [[ "${#assets[@]}" == 7 ]] || { echo "unexpected release asset count" >&2; exit 1; }
          args=(--verify-tag --generate-notes --target "$GITHUB_SHA")
          [[ "$PRERELEASE" == true ]] && args+=(--prerelease)
          gh release create "$RELEASE_TAG" "${assets[@]}" "${args[@]}"
