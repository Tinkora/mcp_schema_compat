name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup component add rustfmt clippy --toolchain 1.95.0
      - run: cargo +1.95.0 fmt --all -- --check
      - run: cargo +1.95.0 test --locked
      - run: cargo +1.95.0 clippy --all-targets --locked -- -D warnings
