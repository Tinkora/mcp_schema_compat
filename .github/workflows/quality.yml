name: Quality

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'

  rust:
    name: Rust quality
    permissions:
      contents: read
    uses: Tinkora/.github/.github/workflows/reusable-rust-quality.yml@e967aed0860957b24daf57e66766713c60b5bcae
    with:
      toolchain: 1.95.0
      msrv: 1.85.0

  windows:
    name: Windows behavior
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        shell: pwsh
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Test Windows behavior
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: cargo test --locked

      - name: Run strict Clippy
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
