[package]
name = "mcp-schema-compat"
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.85"
description = "Deterministic compatibility checks for agent tool schemas"
license = "MIT"
repository = "https://github.com/Tinkora/mcp_schema_compat"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.0"
